<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>法智职航</title>
</head>
<body>
<p id="boot" style="font-family:sans-serif;padding:24px">正在打开法智职航…</p>
<script>
Promise.all([1,2,3].map(function(i){return fetch("part"+i+".txt").then(function(r){if(!r.ok) throw new Error(i); return r.text();});})).then(function(parts){
  document.open();
  document.write(parts.join(""));
  document.close();
}).catch(function(){
  document.getElementById("boot").textContent="页面文件还没齐，请稍后再打开。";
});
</script>
</body>
</html>
